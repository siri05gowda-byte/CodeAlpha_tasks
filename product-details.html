<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: flex;
            gap: 40px;
        }

        .container img {
            width: 400px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        .details {
            flex: 1;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }

        button {
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div id="productDetails">
        Loading product...
    </div>

    <script>

        async function loadProduct() {

            const params =
                new URLSearchParams(window.location.search);

            const productId = params.get("id");

            if (!productId) {

                document.getElementById("productDetails").innerHTML =
                    "Product ID not found.";

                return;
            }

            try {

                const response = await fetch(
                    `http://localhost:5000/api/products/${productId}`
                );

                const product = await response.json();

                document.getElementById("productDetails").innerHTML = `

                    <div class="container">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                        <div class="details">

                            <h1>${product.name}</h1>

                            <p>
                                ${product.description}
                            </p>

                            <p class="price">
                                ₹${product.price}
                            </p>

                            <p>
                                Category:
                                ${product.category}
                            </p>

                            <p>
                                Available Stock:
                                ${product.stock}
                            </p>

                            <button onclick="addToCart('${product._id}')">
                                Add to Cart
                            </button>

                        </div>

                    </div>

                `;

            } catch (error) {

                console.log(error);

                document.getElementById("productDetails").innerHTML =
                    "Unable to load product.";

            }

        }

        async function addToCart(productId) {

    try {

        const response = await fetch(
            `http://localhost:5000/api/products/${productId}`
        );

        const product = await response.json();

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        const existingProduct =
            cart.find(item => item._id === product._id);

        if (existingProduct) {

            existingProduct.quantity++;

        } else {

            cart.push({
                _id: product._id,
                name: product.name,
                price: product.price,
                image: product.image,
                quantity: 1
            });

        }

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        alert("Product added to cart!");

    } catch (error) {

        console.log(error);

        alert("Unable to add product to cart.");

    }

}

        loadProduct();

    </script>

</body>

</html>
