
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | S Fashion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="announcement">WELCOME BACK TO S FASHION</div>

  <header class="site-header">
    <a class="logo" href="index.html">S<span>.</span></a>
    <nav class="header-actions">
      <a href="products.html">Shop</a>
      <a href="register.html">Create account</a>
    </nav>
  </header>

  <main class="page-container">
    <section class="form-card">
      <p class="eyebrow">YOUR STYLE AWAITS</p>
      <h1>Welcome back.</h1>
      <p>Log in to access your account and orders.</p>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email"
            required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
            required autocomplete="current-password" placeholder="Enter your password">
        </div>

        <button class="form-button" type="submit" id="loginButton">
          LOG IN
        </button>

        <p id="loginMessage" class="form-message" role="status"></p>
      </form>

      <p style="margin-top:20px">
        New to S Fashion?
        <a class="text-link" href="register.html">Create an account</a>
      </p>

      <p style="margin-top:12px">
        <a class="text-link" href="products.html">Continue shopping</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="logo footer-logo" href="index.html">S<span>.</span></a>
    <p>Style your way. Every day.</p>
    <small>© 2026 S Fashion. All rights reserved.</small>
  </footer>

  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
